<!DOCTYPE html>
<html lang="th" data-fire="1" data-skin="pop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="จัดคู่แบด">
<meta name="theme-color" content="#ffd23f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>จัดคู่แบดมินตัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;600&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: คู่มือข้างสนาม ชัด เร็ว แตะง่ายด้วยนิ้วเดียว
   IDEA: กระดานคุมสนามของแก๊งแบด — สนามจริงบนจอ แตะฝั่งที่ชนะ
   PICTURE: พื้นสนามสีเขียว เส้นขาว ตาข่ายกลาง ชื่อผู้เล่นแต่ละฝั่ง
   COLOUR and TYPE: เขียวสนาม #1d7a4f, ขาว, ส้ม A #f2602b, ฟ้า B #2b7de9 / Prompt + IBM Plex Sans Thai
   LAYOUT: หัวแถบบน, สนามเรียงกริด, คิวรอด้านล่าง, แถบแท็บติดล่างสำหรับมือถือ */
:root{color-scheme:light;--bg:#f3f6f2;--ink:#12201a;--card:#fff;--line:#dde4de;--mut:#5b6a62;--note:#fff4d6;--court:#1d7a4f;--courtd:#15603d;--a:#f2602b;--b:#2b7de9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0d1411;--ink:#e7efe9;--card:#15201b;--line:#26342d;--mut:#9baba1;--note:#3a2f12}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d1411;--ink:#e7efe9;--card:#15201b;--line:#26342d;--mut:#9baba1;--note:#3a2f12}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,.brand{font-family:Prompt,system-ui,sans-serif;font-weight:700;line-height:1.1;margin:0}
h1{font-size:clamp(28px,5vw,40px)}h2{font-size:22px;margin:28px 0 12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--court);color:#fff;padding:calc(10px + env(safe-area-inset-top)) max(4vw,16px) 10px;display:flex;align-items:center;gap:12px}
.brand{font-size:20px;display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.top .btn{background:rgba(255,255,255,.16);color:#fff;min-height:40px;padding:0 14px;white-space:nowrap}
.top .endb{background:#fff;color:var(--courtd)}
.top .icon{width:44px;padding:0;display:grid;place-items:center}
.top .btn[disabled]{opacity:.4}
.band{padding:22px max(4vw,16px);max-width:1240px;margin:0 auto}
.sub{color:var(--mut);margin:6px 0 18px}
.note{background:var(--note);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:15px}
.btn{border:0;border-radius:12px;background:var(--court);color:#fff;font-weight:600;min-height:46px;padding:0 18px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.light{background:#fff;color:var(--courtd)}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.warn{background:#c8372d}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px}
.court{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 6px 20px -14px rgba(0,0,0,.5)}
.court header{display:flex;align-items:center;gap:10px;margin:0 4px 10px}
.court header b{font-family:Prompt;font-size:18px}
.tag{font-size:13px;color:var(--mut);background:var(--bg);border-radius:99px;padding:2px 10px}
.link{margin-inline-start:auto;background:none;border:0;color:var(--mut);text-decoration:underline;min-height:40px;font-size:14px}
.floor{background:linear-gradient(180deg,var(--court),var(--courtd));border:3px solid #fff;border-radius:6px;display:grid;grid-template-columns:minmax(0,1fr) 8px minmax(0,1fr);min-height:190px;position:relative;box-shadow:inset 0 0 0 10px var(--court),inset 0 0 0 12px rgba(255,255,255,.75)}
.floor.idle{display:grid;place-items:center;grid-template-columns:1fr;padding:16px}
.timer{position:absolute;top:-17px;left:50%;transform:translateX(-50%);z-index:2;border:2px solid #fff;background:#12201a;color:#fff;border-radius:99px;min-height:34px;padding:0 14px;font:600 16px Prompt,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap}
.timer.long{background:#f2602b}
.floor{margin-top:14px}
.net{background:repeating-linear-gradient(180deg,#fff 0 4px,rgba(255,255,255,.25) 4px 8px);margin:-3px 0}
.side{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:28px 10px 14px;position:relative;transition:background .15s}
.side:active,.side:hover{background:rgba(255,255,255,.12)}
.side .nm{background:rgba(0,0,0,.28);color:#fff;font-size:17px;max-width:100%}
.hint{font-size:13px;opacity:.85}
.crown{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#ffd84d;color:#3a2c00;font-weight:600;font-size:13px;border-radius:99px;padding:1px 10px;white-space:nowrap}
.nm{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 12px 3px 4px;background:var(--bg);font-weight:600;white-space:nowrap;position:relative;max-width:100%}
.nm .tx{overflow:hidden;text-overflow:ellipsis}
.g{position:relative}
.cw{position:absolute;width:22px;height:17px;top:-14px;left:-7px;transform:rotate(-20deg);stroke:#111;stroke-width:1.3;stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.cw circle{stroke-width:.9}
.nm.rk1,.side .nm.rk1,[data-skin] .side .nm.rk1,[data-skin] .nm.rk1{background:linear-gradient(135deg,#fff3b0,#ffd23f 55%,#ffb800);color:#111;box-shadow:0 0 0 3px rgba(255,200,40,.45),0 4px 14px -4px rgba(255,170,0,.8)}
.nm.rk2,.side .nm.rk2,[data-skin] .side .nm.rk2,[data-skin] .nm.rk2{background:linear-gradient(135deg,#ffffff,#dfe5ec 60%,#c3ccd7);color:#111;box-shadow:0 0 0 2px rgba(180,192,206,.55)}
.nm.rk3,.side .nm.rk3,[data-skin] .side .nm.rk3,[data-skin] .nm.rk3{background:linear-gradient(135deg,#fde3cb,#eeb487 60%,#d98f5a);color:#111}
.rk1 .cw{fill:#ffcf1a;width:28px;height:21px;top:-18px;left:-9px}.rk1 .cw circle{fill:#ff4d6d}
.rk2 .cw{fill:#e6ebf1}.rk2 .cw circle{fill:#4aa3ff}
.rk3 .cw{fill:#e3965e;width:20px;height:15px;top:-12px;left:-6px}.rk3 .cw circle{fill:#fff}
.spk{position:absolute;right:-7px;top:-9px;color:#ffb800;font-size:14px;line-height:1;text-shadow:0 0 6px rgba(255,200,0,.9);animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
.rk1 .cw{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-20deg) translateY(0)}50%{transform:rotate(-14deg) translateY(-2px)}}
.g{font-style:normal;font-family:Prompt;font-size:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.g.A{background:var(--a)}.g.B{background:var(--b)}
.qcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.qcol h3{display:flex;align-items:center;gap:8px;font:600 17px Prompt,sans-serif;margin:0 0 8px}
.qcol h3 small{margin-inline-start:auto;color:var(--mut);font:400 14px "IBM Plex Sans Thai",sans-serif}
.queue{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.queue li{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.queue li b{font-family:Prompt;width:22px;text-align:right;color:var(--mut)}
.queue li.next{border-color:var(--court);box-shadow:inset 3px 0 0 var(--court)}
.queue small,.plist small{color:var(--mut);margin-inline-start:auto;white-space:nowrap;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.add{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.add input{flex:1 1 240px;font-size:16px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;min-height:40px;padding:0 14px;border-radius:9px;font-weight:600}
.seg button.on{background:var(--court);color:#fff}
.plhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.plist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.plist li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.plist li.off{opacity:.55}
.ren{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%}.ren input{flex:1 1 160px;font-size:16px;min-height:44px;border-radius:12px;border:1px solid var(--court);background:var(--bg);color:var(--ink);padding:0 12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:40px;padding:0 12px;font-size:14px}
.mini.del{color:#c8372d}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:14px;overflow:hidden}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar span{display:block;width:70px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--court)}
.hist{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:15px}
.hist li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.hist em{font-style:normal;color:var(--court);font-weight:600}
.set{display:grid;gap:14px;max-width:720px}
.opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.opt button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px}
.opt button.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court)}
.opt b{display:block;font-family:Prompt}
.opt span{font-size:14px;color:var(--mut)}
.step{display:flex;align-items:center;justify-content:space-between;gap:12px}
.step div{display:flex;align-items:center;gap:8px;flex:none}.round{flex:none}
.step output{font-family:Prompt;font-size:22px;width:36px;text-align:center}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:22px}
.sw{width:56px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--court)}.sw.on::after{left:28px}
details{margin-top:4px}summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
details ol{padding-inline-start:20px;margin:6px 0 0}details li{margin-bottom:6px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;min-height:62px;font-weight:600;font-size:15px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button.on{color:var(--court);box-shadow:inset 0 3px 0 var(--court)}
.tabs svg{width:22px;height:22px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:9;padding:20px}
#modal{z-index:11}
.gbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:inherit;font:inherit;padding:6px 8px 6px 2px;min-height:44px;max-width:52vw}
.gbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.glist li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:6px 8px;background:var(--card)}
.glist li.cur{border-color:var(--court);box-shadow:inset 4px 0 0 var(--court)}
.gopen{flex:1 1 160px;text-align:left;border:0;background:none;min-height:44px;padding:4px 6px}
.gopen b{display:block;font-size:17px}.gopen small{color:var(--mut)}
.modal.show{display:grid}
.modal .card{max-width:400px;width:100%}
.modal p{font-size:18px;margin:4px 0 16px}
.modal .row{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:8;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty-note{color:var(--mut)}
.sect{padding:0 16px}
.sect>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;cursor:pointer}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary b{display:block;font-size:18px}.sect>summary small{display:block;color:var(--mut);font-size:14px;font-weight:400}
.sect .chev{flex:none;transition:transform .2s}.sect[open] .chev{transform:rotate(180deg)}
.sbody{display:grid;gap:12px;padding:2px 0 16px}
.sect .card{box-shadow:none}[data-skin=pop] .sect .card,[data-skin=pop] .sect .opt button{box-shadow:none;border-width:2px}
[data-skin=pop] .sect[open]>summary{border-bottom:2px dashed #111;margin-bottom:12px}
.shrow{display:flex;align-items:center;gap:8px;margin-top:12px}
.shc{display:flex;align-items:center;gap:6px;margin-right:auto;font-size:15px;color:var(--mut)}.shc b{font-size:20px;color:var(--ink)}
.shi{width:22px;height:22px;flex:none}
.shp{min-height:44px;padding:0 16px}
.shsum{margin-top:14px}.shsum h3{display:flex;align-items:center;gap:8px;margin:0;font:600 18px Prompt,sans-serif}
.num{width:96px;min-height:46px;font-size:18px;text-align:center;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.clr{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.clr div{flex:1 1 220px}.clr span{display:block;font-size:14px;color:var(--mut)}.clr .btn{flex:none}
.sumcard{max-width:680px!important;max-height:88vh;overflow:auto}
.pos{color:var(--court);font-weight:600}.neg{color:#c8372d;font-weight:600}
.sess{margin-bottom:10px;padding:4px 14px}.sess>summary{min-height:56px}.sess>summary b{display:block}.sess>summary small{display:block;color:var(--mut);font-weight:400;font-size:14px}.sess table{margin:4px 0 10px}
@media(max-width:600px){.bar span{display:none}th,td{padding:8px 4px}.sumcard{padding:12px}.modal{padding:8px}.sumcard .nm{padding-right:8px}.queue li{padding:7px 8px;gap:6px}.queue li b{width:16px}.queue .nm{padding-right:8px}.queue small{font-size:12px}table{font-size:14px}th,td{padding:8px 6px}.bar span{width:40px}.side .nm{font-size:15px}}

/* ไฟเมื่อชนะติด 5 (เลือกแบบด้วย data-fire บน html) */
.nm.fire{isolation:isolate}
[data-fire="1"] .nm.fire::after,[data-fire="2"] .nm.fire::after{content:"";position:absolute;inset:calc(var(--bw,0px)*-1);border:inherit;border-radius:inherit;background:inherit;z-index:-1;pointer-events:none}
[data-skin=pop] .nm{--bw:2px}
.fb{display:none}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
/* แบบ 1 เปลวไฟลุก */
[data-fire="1"] .nm.fire{box-shadow:0 0 0 2px #ff7a00,0 0 14px 2px rgba(255,90,0,.7)}
[data-fire="1"] .nm.fire::before{content:"";position:absolute;inset:-22px -4px 45%;background:linear-gradient(to top,#ff3d00 0,#ff7a00 35%,#ffb800 65%,#ffe680 100%);clip-path:polygon(0 100%,0 62%,7% 38%,13% 56%,21% 14%,30% 50%,39% 0,49% 44%,58% 6%,67% 46%,76% 16%,85% 52%,93% 30%,100% 60%,100% 100%);z-index:-2;transform-origin:50% 100%;animation:burn .32s steps(1) infinite;filter:drop-shadow(0 0 4px rgba(255,120,0,.8))}
@keyframes burn{0%{clip-path:polygon(0 100%,0 62%,7% 38%,13% 56%,21% 14%,30% 50%,39% 0,49% 44%,58% 6%,67% 46%,76% 16%,85% 52%,93% 30%,100% 60%,100% 100%)}50%{clip-path:polygon(0 100%,0 58%,6% 30%,14% 52%,22% 22%,31% 44%,40% 8%,50% 40%,59% 0,68% 42%,77% 10%,86% 46%,94% 36%,100% 56%,100% 100%)}}
/* แบบ 2 ไฟวิ่งรอบกรอบ */
[data-fire="2"] .nm.fire::before{content:"";position:absolute;inset:-6px;border-radius:99px;background:conic-gradient(from var(--ang),#ff3d00,#ffb800,#fff3b0,#ff7a00,#ff3d00,#ffb800,#ff3d00);z-index:-2;animation:spin 1.1s linear infinite;filter:drop-shadow(0 0 6px rgba(255,110,0,.8))}
@keyframes spin{to{--ang:360deg}}
/* แบบ 3 ป้ายไฟพร้อมตัวเลข */
[data-fire="3"] .nm.fire{box-shadow:0 0 0 2px #ff5a00;animation:pulse 1.2s ease-in-out infinite}
[data-fire="3"] .fb{display:inline-flex;align-items:center;gap:2px;position:absolute;right:-12px;top:-13px;background:linear-gradient(180deg,#ffb800,#ff3d00);color:#fff;border:2px solid #111;border-radius:99px;padding:0 6px 0 4px;font:700 12px/18px Mitr,Prompt,sans-serif;z-index:2}
[data-fire="3"] .fb svg{width:9px;height:12px;fill:#fff3b0}
[data-fire="3"] .nm.fire .spk{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px #ff5a00,0 0 0 0 rgba(255,90,0,.6)}50%{box-shadow:0 0 0 2px #ff5a00,0 0 16px 4px rgba(255,90,0,.7)}}
/* 3 ขนไก่ป๊อป */
:root[data-skin=pop]:not(#z){color-scheme:light;--bg:#cfe7ff;--ink:#111;--card:#fff;--line:#111;--mut:#39424d;--note:#fff1b8;--court:#17a673;--courtd:#0f8a5e;--a:#ff5d3a;--b:#3a6bff;--hi:#ffd23f}
[data-skin=pop] body{font-family:Mitr,sans-serif;font-weight:300}
[data-skin=pop] h1,[data-skin=pop] h2,[data-skin=pop] .brand,[data-skin=pop] .court header b,[data-skin=pop] .opt b,[data-skin=pop] .qcol h3,[data-skin=pop] .timer,[data-skin=pop] b,[data-skin=pop] .btn,[data-skin=pop] .step output{font-family:Mitr,sans-serif;font-weight:500}
[data-skin=pop] .top{background:var(--hi);color:#111;border-bottom:2.5px solid #111}
[data-skin=pop] .brand svg path:first-of-type{fill:#fff;stroke:#111;stroke-width:1.5}
[data-skin=pop] .top .btn{background:#fff;color:#111;border:2px solid #111;box-shadow:2px 2px 0 #111}
[data-skin=pop] .top .endb{background:var(--a);color:#fff}
[data-skin=pop] .court,[data-skin=pop] .card,[data-skin=pop] .queue li,[data-skin=pop] .plist li,[data-skin=pop] .hist li,[data-skin=pop] table,[data-skin=pop] .opt button{border:2.5px solid #111;box-shadow:4px 4px 0 #111;border-radius:16px}
[data-skin=pop] .queue li.next{background:var(--hi);box-shadow:4px 4px 0 #111}
[data-skin=pop] .opt button.on{background:var(--hi)}
[data-skin=pop] .btn{border:2px solid #111;box-shadow:3px 3px 0 #111;transition:transform .08s,box-shadow .08s}
[data-skin=pop] .btn:active,[data-skin=pop] .mini:active,[data-skin=pop] .round:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111}

<script>
{
const KEY='badpair-v1';
// Firebase สำหรับแชร์ให้คนอื่นดู (ค่า apiKey เปิดเผยได้ ความปลอดภัยอยู่ที่ Rules ของฐานข้อมูล)
const FB={apiKey:"AIzaSyAVlQLpNc0z44pmZvCvwPWt87RaHFGuKvQ",authDomain:"godsandteebadgun.firebaseapp.com",databaseURL:"https://godsandteebadgun-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"godsandteebadgun",storageBucket:"godsandteebadgun.firebasestorage.app",messagingSenderId:"721004259215",appId:"1:721004259215:web:8f1ab2acfdede1cb8f0dfa"};
const APP_URL='https://godsand.github.io/TeeBadGun/';
const VKEY=KEY+'-view';
let VIEW=null;try{VIEW=new URLSearchParams(location.search).get('view');if(VIEW)localStorage.setItem(VKEY,VIEW);else VIEW=localStorage.getItem(VKEY)}catch(e){}
if(VIEW&&!/^[a-z0-9]{6,40}$/.test(VIEW))VIEW=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let S,undo=[],addG='A',editId=null,mfn=null,tt=null;
const blank=()=>({players:[],courts:[],history:[],clock:1,seq:1,tab:'courts',settings:{mode:'king',maxWins:2,courts:2,balance:true,sameDiff:4,timeWarn:15,scoreMode:'points',topPts:10,minusMax:5,minG:3},sessions:[],shTotal:0});
function addP(s,name,g){s.players.push({id:s.seq++,name,g,active:true,games:0,wins:0,lp:null,lo:[],par:{},opp:{},q:s.clock++})}
function sample(){const s=blank();['ต้น','บอย','เอ็ม','ปอนด์','กอล์ฟ','บีม','โอ๊ต'].forEach(n=>addP(s,n,'A'));['มิ้นท์','แพร','ฝน','นุ่น','จูน'].forEach(n=>addP(s,n,'B'));s.sample=true;return s}
// ก๊วน: แต่ละก๊วนเก็บข้อมูลแยกกันทั้งหมด (ผู้เล่น สกอร์ คะแนน การตั้งค่า)
const GKEY=KEY+'-groups';let G=null,gEdit=null;
const skey=id=>id==='main'?KEY:KEY+'-g-'+id;
function loadG(){try{G=JSON.parse(localStorage.getItem(GKEY))}catch(e){G=null}if(!G||!Array.isArray(G.list)||!G.list.length)G={cur:'main',list:[{id:'main',name:'ก๊วนหลัก'}]};if(!G.list.some(g=>g.id===G.cur))G.cur=G.list[0].id}
function saveG(){if(VIEW)return;try{localStorage.setItem(GKEY,JSON.stringify(G))}catch(e){}if(acctOn())schedAcct()}
const gName=()=>(G.list.find(g=>g.id===G.cur)||{}).name||'จัดคู่แบด';
function load(id){try{const t=localStorage.getItem(skey(id||G.cur));if(t)return JSON.parse(t)}catch(e){}return null}
function save(){if(VIEW)return;try{localStorage.setItem(skey(G.cur),JSON.stringify(S))}catch(e){}if(shRoom())schedPush();if(acctOn())schedAcct(G.cur)}
function openState(){const x=load();if(!x){S=G.cur==='main'?sample():blank();syncCourts();if(S.sample)autofill()}
  else{S=x;S.settings=Object.assign(blank().settings,S.settings);if(!S.sessions)S.sessions=[];if(S.shTotal==null)S.shTotal=0;S.courts.forEach(c=>{if(c.t1&&!c.start)c.start=Date.now()});syncCourts()}}
function switchGroup(id){if(id===G.cur){closeGrp();return}save();const tab=S.tab;G.cur=id;saveG();undo=[];editId=null;openState();S.tab=tab;closeGrp();commit();toast('เปิดก๊วน '+gName())}
function grpHTML(){return `<h2 style="margin:0 0 4px">ก๊วน</h2><p class="sub">แต่ละก๊วนแยกผู้เล่น สกอร์ คะแนนสะสม และการตั้งค่าออกจากกันทั้งหมด</p>
  <ul class="glist">${G.list.map(g=>{const x=g.id===G.cur?S:load(g.id),n=x&&x.players?x.players.length:0,cur=g.id===G.cur;
    return g.id===gEdit?`<li><form class="ren" id="grenf" data-g="${esc(g.id)}"><input id="gren" value="${esc(g.name)}" maxlength="30" aria-label="ชื่อก๊วน" autocomplete="off"><button class="btn">บันทึก</button><button class="btn ghost" type="button" data-act="grencancel">ยกเลิก</button></form></li>`
    :`<li class="${cur?'cur':''}"><button class="gopen" data-act="gopen" data-g="${esc(g.id)}"><b>${esc(g.name)}</b><small>${n} คน${cur?' · ใช้อยู่':''}</small></button><span class="acts"><button class="mini" data-act="gren" data-g="${esc(g.id)}">แก้ชื่อ</button>${G.list.length>1?`<button class="mini del" data-act="gdel" data-g="${esc(g.id)}">ลบ</button>`:''}</span></li>`}).join('')}</ul>
  <form class="add" id="gnewf" style="margin-top:14px"><input id="gnew" placeholder="ชื่อก๊วนใหม่ เช่น ก๊วนวันพุธ" maxlength="30" autocomplete="off" aria-label="ชื่อก๊วนใหม่"><button class="btn">สร้างก๊วน</button></form>
  <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-act="gclose">ปิด</button></div>`}
function openGrp(){gEdit=null;$('#grpbody').innerHTML=grpHTML();$('#grp').classList.add('show')}
function refreshGrp(){$('#grpbody').innerHTML=grpHTML();const i=$('#gren');if(i){i.focus();i.select()}}
function closeGrp(){gEdit=null;$('#grp').classList.remove('show')}
function snap(){undo.push(JSON.stringify(S));if(undo.length>40)undo.shift()}
const P=id=>S.players.find(p=>p.id===id);
const busy=()=>new Set(S.courts.flatMap(c=>c.t1?[...c.t1,...c.t2]:[]));
const queue=()=>{const b=busy();return S.players.filter(p=>p.active&&!b.has(p.id)).sort((a,c)=>a.q-c.q||a.games-c.games)};
const rate=p=>(p.wins+1)/(p.games+2);
const typ=t=>t.map(p=>p.g).sort().join('');
// ข้อ 4: ห้ามคู่เดิมล่าสุด (โทษหนัก) + เคยคู่กันบ่อย
const pairCost=(a,b)=>(a.lp===b.id||b.lp===a.id?100:0)+(a.par[b.id]||0)*3;
// ข้อ 7: เจอคู่ตรงข้ามซ้ำ
function oppCost(t1,t2){let c=0;for(const a of t1)for(const b of t2){c+=(a.opp[b.id]||0)*5;if(a.lo.includes(b.id))c+=12}return c}
// ข้อ 6: ถ่วงฝีมือจาก %ชนะ ไม่ให้ทีมแข็งรวมกัน
const bal=(t1,t2)=>S.settings.balance?Math.abs(rate(t1[0])+rate(t1[1])-rate(t2[0])-rate(t2[1]))*25:0;
const SPL=[[0,1,2,3],[0,2,1,3],[0,3,1,2]];
const cnt=g=>S.players.filter(p=>p.active&&p.g===g).length;
// ข้อ 2: AA vs AA / BB vs BB ได้เฉพาะเมื่อกลุ่มหนึ่งมากกว่าอีกกลุ่มตั้งแต่ 4 คน (คงที่)
function sameOK(){const d=cnt('A')-cnt('B'),th=4;return d>=th?'AA':-d>=th?'BB':null}
function pool(){const q=queue(),out=q.slice(0,8);for(const g of ['A','B'])out.push(...q.filter(p=>p.g===g&&!out.includes(p)).slice(0,4));
  return out.map(p=>({p,r:q.indexOf(p)})).sort((a,b)=>a.r-b.r)}
function bestMatch(){const q=pool(),n=q.length,same=sameOK();let best=null;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++){
    const f=[q[a].p,q[b].p,q[c].p,q[d].p],rk=(q[a].r+q[b].r+q[c].r+q[d].r)*2;
    for(const s of SPL){const t1=[f[s[0]],f[s[1]]],t2=[f[s[2]],f[s[3]]],ty=typ(t1);
      if(ty!==typ(t2)||(ty!=='AB'&&ty!==same))continue;
      const cost=rk+(ty==='AB'?0:8)+pairCost(...t1)+pairCost(...t2)+oppCost(t1,t2)+bal(t1,t2);
      if(!best||cost<best.cost)best={cost,t1,t2}}}
  return best}
function bestChallenger(stay){const q=pool().filter(x=>!stay.includes(x.p)),ty=typ(stay);let best=null;if(ty!=='AB'&&ty!==sameOK())return null;
  for(let a=0;a<q.length;a++)for(let b=a+1;b<q.length;b++){const t=[q[a].p,q[b].p];if(typ(t)!==ty)continue;
    const cost=(q[a].r+q[b].r)*2+pairCost(...t)+oppCost(stay,t)+bal(stay,t);if(!best||cost<best.cost)best={cost,t}}
  return best}
function clearC(c){c.t1=null;c.t2=null;c.stay=null;c.streak=0;c.start=null}
function fill(c){const m=bestMatch();if(!m)return false;c.t1=m.t1.map(p=>p.id);c.t2=m.t2.map(p=>p.id);c.stay=null;c.streak=0;c.start=Date.now();return true}
function autofill(){S.courts.forEach(c=>{if(!c.t1)fill(c)})}
function toQueue(ids){ids.forEach(id=>{const p=P(id);if(p)p.q=S.clock++})}
function front(ids){const q=queue();let m=q.length?Math.min(...q.map(p=>p.q)):0;ids.slice().reverse().forEach(id=>{const p=P(id);if(p)p.q=--m})}
function syncCourts(){const n=S.settings.courts;
  while(S.courts.length<n)S.courts.push({no:S.courts.length+1,t1:null,t2:null,stay:null,streak:0});
  while(S.courts.length>n){const c=S.courts.pop();if(c.t1)front([...c.t1,...c.t2]);if(c.sh)S.courts[S.courts.length-1].sh=(S.courts[S.courts.length-1].sh||0)+c.sh}}
function record(ci,k){snap();const c=S.courts[ci],T=[c.t1,c.t2],W=T[k].map(P),L=T[1-k].map(P),gsh=c.sh||0;
  c.sh=0;
  for(const t of [W,L]){const o=t===W?L:W;t[0].lp=t[1].id;t[1].lp=t[0].id;
    t[0].par[t[1].id]=(t[0].par[t[1].id]||0)+1;t[1].par[t[0].id]=(t[1].par[t[0].id]||0)+1;
    for(const p of t){p.games++;p.lo=o.map(x=>x.id);for(const x of o)p.opp[x.id]=(p.opp[x.id]||0)+1}}
  W.forEach(p=>{p.wins++;p.ws=(p.ws||0)+1});L.forEach(p=>p.ws=0);
  const hot=W.filter(p=>p.ws===5);
  const streak=c.stay===k?c.streak+1:1,king=S.settings.mode==='king';
  S.history.unshift({n:S.history.length+1,c:c.no,sh:gsh,d:c.start?Date.now()-c.start:0,w:W.map(p=>p.name),l:L.map(p=>p.name),st:king?streak:0});
  let msg;
  if(king&&streak<2){
    clearC(c);toQueue(L.map(p=>p.id));const ch=bestChallenger(W);
    if(ch){c.t1=W.map(p=>p.id);c.t2=ch.t.map(p=>p.id);c.stay=0;c.streak=streak;c.start=Date.now();msg=`ผู้ชนะอยู่ต่อ (ชนะติด ${streak}) ผู้แพ้ไปท้ายคิว`}
    else{toQueue(W.map(p=>p.id));fill(c);msg='ไม่มีคู่ท้าชิงกลุ่มตรงกัน จึงจัดใหม่ทั้งสนาม'}
  }else{clearC(c);toQueue(L.map(p=>p.id));toQueue(W.map(p=>p.id));fill(c);
    msg=king?`ชนะติด ${streak} ครั้ง ออกทั้ง 2 คู่`:'จบเกม ออกทั้ง 2 คู่'}
  if(!c.t1)msg+=' · คนรอไม่พอสำหรับสนามนี้';
  if(hot.length)msg=`${hot.map(p=>p.name).join(' + ')} ชนะติด 5 เกม ติดไฟแล้ว! · `+msg;
  autofill();commit();toast(msg)}
function cancelGame(ci){snap();const c=S.courts[ci],ids=[...c.t1,...c.t2];clearC(c);front(ids);commit();toast('ยกเลิกเกมแล้ว ผู้เล่นกลับไปหัวคิว')}
const fmt=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60,z=n=>String(n).padStart(2,'0');return (h?h+':'+z(m):z(m))+':'+z(x)};
function tick(){const now=Date.now(),lim=S.settings.timeWarn*60000;document.querySelectorAll('.tm').forEach(e=>{const d=now-(+e.dataset.s);e.textContent=fmt(d);e.parentNode.classList.toggle('long',lim>0&&d>=lim)})}
setInterval(tick,1000);
let TOP={};const OPEN={match:false,score:false,clear:false};
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('sect'))OPEN[d.dataset.sec]=d.open},true);
document.addEventListener('badpair:render',()=>render());
function calcTop(){TOP={};standings().rows.forEach(o=>{if(o.rank<=3)TOP[o.p.id]=o.rank})}
const CROWN='<svg class="cw" viewBox="0 0 24 18" aria-hidden="true"><path d="M2.5 16 1.5 5l6 4.2L12 1.8l4.5 7.4 6-4.2-1 11z"/><circle cx="12" cy="11" r="1.7"/><circle cx="6.5" cy="12" r="1.2"/><circle cx="17.5" cy="12" r="1.2"/></svg>';
const FLAME='<svg viewBox="0 0 12 16" aria-hidden="true"><path d="M6 .5C7 4 11 5.5 11 10a5 5 0 0 1-10 0c0-2.4 1.4-3.6 2.4-4.6C3.6 7 4.4 8 5.4 8 4.6 5.4 5 2.6 6 .5z"/></svg>';

function chip(p,rk){if(!p)return '';if(rk===undefined)rk=TOP[p.id]||0;const hot=isHot(p),n=Math.max(p.ws||0,5);const t=['','อันดับ 1','อันดับ 2','อันดับ 3'][rk]||'';

function standings(){const s=S.settings,el=S.players.filter(p=>p.games>=s.minG).sort((a,b)=>b.wins/b.games-a.wins/a.games||b.wins-a.wins),N=el.length,M=Math.ceil(N/2),P=s.topPts,Q=s.minusMax,on=s.scoreMode==='points'&&N>=4;
  const raw=r=>r===M?0:r<M?(r===1?P:(P-3)*(M-r)/(M-2)):-Q*(r-M)/(N-M);
  const rows=[];let i=0;
  while(i<N){const a=el[i];let j=i;while(j+1<N&&el[j+1].wins*a.games===a.wins*el[j+1].games&&el[j+1].wins===a.wins)j++;

    for(let k=i;k<=j;k++)rows.push({p:el[k],rank:i+1,pt});i=j+1}
  return {rows,on,low:S.players.filter(p=>p.games>0&&p.games<s.minG)}}

function shareCard(){const r=shRoom();
  if(!FB)return `<div class="card"><b>แชร์ให้คนอื่นดู</b><p class="sub" style="margin:6px 0 0">ยังไม่ได้ตั้งค่า Firebase</p></div>`;
  return `<div class="card"><b>แชร์ให้คนอื่นดู (ดูได้อย่างเดียว)</b><p class="sub" style="margin:6px 0 0">คนที่เปิดลิงก์จะเห็นสนาม คิว และสกอร์ของก๊วน “${esc(gName())}” ตรงกับเครื่องนี้แบบสด แต่แก้ไขอะไรไม่ได้ ต้องมีอินเทอร์เน็ตทั้งสองฝั่ง</p>
  ${r?`<div class="shlink"><input readonly value="${esc(shLink(r))}" aria-label="ลิงก์สำหรับดู" onclick="this.select()"><button class="btn" data-act="shsend">ส่งลิงก์</button><button class="btn ghost" data-act="shcopy">คัดลอก</button><button class="btn ghost" data-act="shoff">หยุดแชร์</button></div><p id="shst" class="shst${shSt[0]==='!'?' err':shSt[0]==='+'?' ok':''}">${esc(shSt.replace(/^[!+]/,'')||'กำลังเชื่อมต่อ…')}</p>`
  :`<div style="margin-top:12px"><button class="btn" data-act="shon">เปิดลิงก์สำหรับดู</button></div><p id="shst" class="shst err">${shSt[0]==='!'?esc(shSt.slice(1)):''}</p>`}</div>`}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t||VIEW)return;const a=t.dataset.act,r=shRoom();
  if(a==='shon'){t.disabled=true;t.textContent='กำลังเปิด…';
    try{const f=await fb();await me(f);G.share=G.share||{};G.share[G.cur]=rid();saveG();shSt='';render();await doPush();if(shSt[0]==='!')throw 0;toast('เปิดลิงก์แล้ว ส่งให้เพื่อนได้เลย')}
    catch(err){if(G.share)delete G.share[G.cur];saveG();shSt='!เปิดไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่';render()}}
  else if(a==='shcopy'&&r){try{navigator.clipboard.writeText(shLink(r)).then(()=>toast('คัดลอกลิงก์แล้ว'),()=>toast('คัดลอกไม่ได้ กดค้างที่ลิงก์แล้วคัดลอก'))}catch(err){toast('คัดลอกไม่ได้')}}
  else if(a==='shsend'&&r){const d={title:'ดูสนามแบด '+gName(),url:shLink(r)};if(navigator.share)navigator.share(d).catch(()=>{});else{try{navigator.clipboard.writeText(d.url);toast('คัดลอกลิงก์แล้ว')}catch(err){}}}
  else if(a==='shoff'&&r)ask('หยุดแชร์? คนที่เปิดลิงก์อยู่จะเห็นว่าปิดการแชร์ และลิงก์นี้จะใช้ไม่ได้อีก','หยุดแชร์',async()=>{delete G.share[G.cur];saveG();shSt='';render();
    try{const f=await fb(),uid=await me(f);await f.D.set(f.D.ref(f.db,'rooms/'+r),{owner:uid,name:gName(),stopped:true})}catch(err){}toast('หยุดแชร์แล้ว')})});
// ---------- บัญชี ID + รหัสผ่าน: ข้อมูลทุกก๊วนผูกกับบัญชี ใช้ต่อได้ทุกเครื่อง ----------
const AKEY=KEY+'-acct',DEV=(()=>{try{let d=localStorage.getItem(KEY+'-dev');if(!d){d=rid();localStorage.setItem(KEY+'-dev',d)}return d}catch(e){return rid()}})();
let acct=null,acctUid=null,aSt='',unsubA=null,rKeys=new Set(),aT=null,aG=false,aS=new Set(),aPend=null;
const umail=u=>u+'@users.teebadgun.app';
function acctOn(){return !VIEW&&!!acctUid}
function setA(t){aSt=t;const e=$('#ast');if(e){e.textContent=t.replace(/^[!+]/,'');e.className='shst'+(t[0]==='!'?' err':t[0]==='+'?' ok':'')}}
const now=()=>new Date().toLocaleTimeString('th-TH');
function gNoCur(){const g=Object.assign({},G);delete g.cur;return JSON.stringify(g)}
function schedAcct(gid){if(gid)aS.add(gid);else aG=true;clearTimeout(aT);aT=setTimeout(pushAcct,500)}
async function pushAcct(){if(!acctOn())return;const f=await fb(),t=f.D.serverTimestamp(),up={};
  if(aG){up.G={s:gNoCur(),dev:DEV,t};rKeys.forEach(k=>{if(!G.list.some(x=>x.id===k))up['states/'+k]=null})}
  aS.forEach(id=>{let s=null;try{s=id===G.cur?JSON.stringify(S):localStorage.getItem(skey(id))}catch(e){}if(s&&G.list.some(x=>x.id===id))up['states/'+id]={s,dev:DEV,t}});
  aG=false;aS.clear();if(!Object.keys(up).length)return;
  try{await f.D.update(f.D.ref(f.db,'users/'+acctUid),up);setA('+ซิงก์แล้ว '+now())}catch(e){setA('!ซิงก์ไม่สำเร็จ (ไม่มีเน็ต?) จะลองใหม่เมื่อมีการเปลี่ยนแปลง');aG=true}}
function uploadAll(){aG=true;G.list.forEach(g=>aS.add(g.id));return pushAcct()}
function applyRemote(v,force){v=v||{};rKeys=new Set(Object.keys(v.states||{}));let ch=false;
  if(v.G&&v.G.s&&(force||v.G.dev!==DEV)&&v.G.s!==gNoCur()){try{const g=JSON.parse(v.G.s);if(Array.isArray(g.list)&&g.list.length){g.cur=g.list.some(x=>x.id===G.cur)?G.cur:g.list[0].id;G=g;localStorage.setItem(GKEY,JSON.stringify(G));ch=true}}catch(e){}}
  for(const [id,x] of Object.entries(v.states||{})){if(!x||!x.s||(!force&&x.dev===DEV))continue;let cur=null;try{cur=localStorage.getItem(skey(id))}catch(e){}
    if(cur!==x.s){try{localStorage.setItem(skey(id),x.s)}catch(e){}if(id===G.cur)ch=true}}
  if(ch){const tab=S.tab;openState();S.tab=tab;undo=[];editId=null;render();if(!force)toast('อัปเดตจากอีกเครื่องแล้ว')}}
function listenAcct(f){if(unsubA)unsubA();unsubA=f.D.onValue(f.D.ref(f.db,'users/'+acctUid),s=>{applyRemote(s.val(),false);setA('+ซิงก์แล้ว '+now())},()=>setA('!อ่านข้อมูลบัญชีไม่ได้'))}
function setAcct(f){const u=f.auth.currentUser;acctUid=u.uid;acct=(u.email||'').split('@')[0];try{localStorage.setItem(AKEY,acct)}catch(e){}}
function aErr(e){const c=e&&e.code||'';return c.includes('email-already-in-use')||c.includes('credential-already-in-use')?'ID นี้มีคนใช้แล้ว ลองชื่ออื่น':
  /invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)?'ID หรือรหัสผ่านไม่ถูกต้อง':c.includes('too-many-requests')?'ลองผิดหลายครั้ง รอสักครู่แล้วลองใหม่':
  c.includes('operation-not-allowed')?'ยังไม่ได้เปิดล็อกอินแบบรหัสผ่านใน Firebase':c.includes('weak-password')?'รหัสผ่านสั้นไป (อย่างน้อย 6 ตัว)':c.includes('network')?'ไม่มีอินเทอร์เน็ต':'ไม่สำเร็จ ('+(c||'error')+')'}
function acctCard(){if(!FB||VIEW)return '';
  if(acctOn())return `<div class="card"><b>บัญชี: ${esc(acct)}</b><p class="sub" style="margin:6px 0 0">ข้อมูลทุกก๊วน ประวัติ คะแนนสะสม และลิงก์แชร์ ผูกกับบัญชีนี้ ล็อกอินเครื่องไหนก็คุมสนามต่อได้ทันที ลิงก์ผู้ชมใช้ลิงก์เดิม</p>
    <p id="ast" class="shst${aSt[0]==='!'?' err':aSt[0]==='+'?' ok':''}">${esc(aSt.replace(/^[!+]/,'')||'กำลังซิงก์…')}</p><div style="margin-top:10px"><button class="btn ghost" data-act="aout">ออกจากระบบ</button></div></div>`;
  return `<div class="card"><b>บัญชี (ไม่บังคับ)</b><p class="sub" style="margin:6px 0 0">สมัคร ID เพื่อให้ข้อมูลและประวัติตามไปทุกเครื่อง และเป็นผู้คุมสนาม (host) จากเครื่องไหนก็ได้ · <b>จำรหัสผ่านไว้ให้ดี ลืมแล้วกู้คืนไม่ได้</b></p>
    <form id="af" class="afm"><input id="au" placeholder="ID (a-z 0-9 . _ -)" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" aria-label="ID"><input id="ap" type="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" autocomplete="current-password" aria-label="รหัสผ่าน"><div><button class="btn">เข้าสู่ระบบ</button><button class="btn ghost" type="button" data-act="aup">สมัคร ID ใหม่</button></div></form>
    <p id="ast" class="shst${aSt[0]==='!'?' err':''}">${aSt[0]==='!'?esc(aSt.slice(1)):''}</p></div>`}
async function doAuth(mode){const u=($('#au').value||'').trim().toLowerCase(),p=$('#ap').value||'';
  if(!/^[a-z0-9._-]{3,20}$/.test(u)){setA('!ID ใช้ได้เฉพาะ a-z 0-9 . _ - ยาว 3–20 ตัว');return}
  if(p.length<6){setA('!รหัสผ่านต้องมีอย่างน้อย 6 ตัว');return}
  setA(mode==='up'?'กำลังสมัคร…':'กำลังเข้าสู่ระบบ…');
  try{const f=await fb();await f.auth.authStateReady();const prev=f.auth.currentUser;let linked=false;
    if(mode==='up'){if(prev&&prev.isAnonymous){await f.Au.linkWithCredential(prev,f.Au.EmailAuthProvider.credential(umail(u),p));linked=true}else await f.Au.createUserWithEmailAndPassword(f.auth,umail(u),p)}
    else await f.Au.signInWithEmailAndPassword(f.auth,umail(u),p);
    const uid=f.auth.currentUser.uid,v=(await f.D.get(f.D.ref(f.db,'users/'+uid))).val();
    if(!linked&&G.share){G.share={};try{localStorage.setItem(GKEY,JSON.stringify(G))}catch(e){}}
    if(v&&v.G&&v.G.s){aPend={f,v};$('#sumbody').innerHTML=`<h2 style="margin:0 0 6px">บัญชี ${esc(u)} มีข้อมูลอยู่แล้ว</h2><p class="sub">จะใช้ข้อมูลชุดไหน</p>
      <div class="opt" style="margin-top:12px"><button data-act="aacc"><b>ใช้ข้อมูลในบัญชี</b><span>แนะนำ ข้อมูลในเครื่องนี้จะถูกแทนที่ (เก็บสำรองไว้ในเครื่อง)</span></button><button data-act="aloc"><b>ใช้ข้อมูลในเครื่องนี้</b><span>อัปโหลดข้อมูลเครื่องนี้ทับข้อมูลในบัญชี</span></button></div>`;$('#sum').classList.add('show');return}
    setAcct(f);await uploadAll();listenAcct(f);aSt='';render();toast(mode==='up'?'สมัครแล้ว ข้อมูลในเครื่องนี้ผูกกับ ID '+u:'เข้าสู่ระบบแล้ว')}
  catch(e){setA('!'+aErr(e))}}
document.addEventListener('submit',e=>{if(e.target.id!=='af')return;e.preventDefault();doAuth('in')});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t||VIEW)return;const a=t.dataset.act;
  if(a==='aup')doAuth('up');
  else if((a==='aacc'||a==='aloc')&&aPend){const {f,v}=aPend;aPend=null;$('#sum').classList.remove('show');setAcct(f);
    if(a==='aacc'){try{const bk={G,states:{}};G.list.forEach(g=>{bk.states[g.id]=localStorage.getItem(skey(g.id))});localStorage.setItem(KEY+'-bak',JSON.stringify(bk))}catch(err){}applyRemote(v,true);rKeys=new Set(Object.keys(v.states||{}))}
    else{rKeys=new Set(Object.keys(v.states||{}));await uploadAll()}
    listenAcct(f);aSt='';render();toast('เข้าสู่ระบบแล้ว')}
  else if(a==='aout')ask('ออกจากระบบ? ข้อมูลยังอยู่ในเครื่องนี้ แต่จะไม่ซิงก์และหยุดส่งข้อมูลให้ลิงก์ผู้ชมจากเครื่องนี้','ออกจากระบบ',async()=>{
    try{const f=await fb();if(unsubA)unsubA();unsubA=null;await f.Au.signOut(f.auth)}catch(err){}
    acctUid=acct=null;aSt='';try{localStorage.removeItem(AKEY)}catch(err){}G.share={};saveG();render();toast('ออกจากระบบแล้ว')})});
function resumeAcct(){let had=null;try{had=localStorage.getItem(AKEY)}catch(e){}if(!had||!FB)return;
  fb().then(async f=>{await f.auth.authStateReady();const u=f.auth.currentUser;if(u&&!u.isAnonymous){setAcct(f);listenAcct(f);render()}else{try{localStorage.removeItem(AKEY)}catch(e){}}}).catch(()=>{acct=had;setA('!ออฟไลน์ ใช้ข้อมูลในเครื่องไปก่อน')})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||VIEW)return;const a=t.dataset.act;
  if(a==='appcopy'){try{navigator.clipboard.writeText(APP_URL).then(()=>toast('คัดลอกลิงก์แอปแล้ว'),()=>toast('คัดลอกไม่ได้ กดค้างที่ลิงก์แล้วคัดลอก'))}catch(err){toast('คัดลอกไม่ได้')}}
  else if(a==='appshare'){const d={title:'แอปจัดคู่แบดมินตัน',text:'แอปจัดคู่ตีแบด แบ่งกลุ่ม A/B สลับคู่อัตโนมัติ มีสกอร์บอร์ด ใช้ฟรี',url:APP_URL};if(navigator.share)navigator.share(d).catch(()=>{});else{try{navigator.clipboard.writeText(APP_URL);toast('คัดลอกลิงก์แอปแล้ว')}catch(err){}}}});
// ---------- โหมดผู้ชม ----------
function vbar(state,extra){const b=$('#vbar');b.hidden=false;b.innerHTML=`<i class="dot ${state}"></i><span><b>ดูอย่างเดียว</b> · ${esc(gName())}${extra?' · '+esc(extra):''}</span><button type="button" data-act="vexit">ออก</button>`}
function startView(){document.documentElement.classList.add('ro');G={cur:'view',list:[{id:'view',name:'กำลังโหลด…'}]};S=blank();S.tab='courts';syncCourts();
  let conn='',last='กำลังเชื่อมต่อ…';const bar=()=>vbar(conn,last);bar();
  document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');
    if(t&&t.dataset.act==='vexit'){e.stopImmediatePropagation();ask('ออกจากโหมดดู แล้วเปิดแอปเป็นของตัวเอง?','ออก',()=>{try{localStorage.removeItem(VKEY)}catch(err){}location.href=location.pathname});return}
    if((t&&!['scopy','copy','sumclose'].includes(t.dataset.act))||e.target.closest('#gbtn,#undo')){e.stopImmediatePropagation();e.preventDefault()}},true);
  document.addEventListener('submit',e=>{e.stopImmediatePropagation();e.preventDefault()},true);
  fb().then(f=>{f.D.onValue(f.D.ref(f.db,'.info/connected'),s=>{conn=s.val()?'on':'off';if(!s.val())last='ขาดการเชื่อมต่อ กำลังลองใหม่…';bar()});
    f.D.onValue(f.D.ref(f.db,'rooms/'+VIEW),s=>{const v=s.val();
      if(!v||v.stopped||!v.state){if(v&&v.name)G.list[0].name=v.name;S=blank();S.tab=S.tab||'courts';syncCourts();last=v?'ผู้คุมสนามปิดการแชร์แล้ว':'ไม่พบห้องนี้ ตรวจลิงก์อีกครั้ง';render();bar();return}
      try{const tab=S.tab,o=JSON.parse(v.state);S=Object.assign(blank(),o);S.settings=Object.assign(blank().settings,o.settings);S.tab=tab==='settings'?'courts':tab;G.list[0].name=v.name||'จัดคู่แบด';
        last='อัปเดต '+new Date(v.t||Date.now()).toLocaleTimeString('th-TH');render();bar()}catch(err){}},()=>{last='เปิดห้องนี้ไม่ได้';bar()})})
  .catch(()=>{conn='off';last=FB?'โหลดไม่สำเร็จ ตรวจอินเทอร์เน็ต':'ยังไม่ได้ตั้งค่า Firebase';bar()})}
if(VIEW)startView();else{loadG();openState();if(shRoom())schedPush();resumeAcct()}
$('#gbtn').addEventListener('click',openGrp);
document.addEventListener('submit',e=>{const f=e.target;
  if(f.id==='gnewf'){e.preventDefault();const nm=$('#gnew').value.trim().slice(0,30);if(!nm){toast('กรุณาใส่ชื่อก๊วน');return}
    if(G.list.some(g=>g.name===nm)){toast('มีก๊วนชื่อนี้อยู่แล้ว');return}
    save();const id='g'+Date.now().toString(36),tab=S.tab;G.list.push({id,name:nm});G.cur=id;saveG();undo=[];editId=null;S=blank();S.tab=tab==='settings'?'players':tab;syncCourts();closeGrp();commit();toast('สร้างก๊วน '+nm+' แล้ว เพิ่มผู้เล่นได้เลย');if(S.tab!=='players'){S.tab='players';commit()}}
  else if(f.id==='grenf'){e.preventDefault();const g=G.list.find(x=>x.id===f.dataset.g),nm=$('#gren').value.trim().slice(0,30);if(!g||!nm)return;
    if(G.list.some(x=>x!==g&&x.name===nm)){toast('มีก๊วนชื่อนี้อยู่แล้ว');return}g.name=nm;gEdit=null;saveG();refreshGrp();render()}});
document.addEventListener('click',e=>{const t=e.target.closest('#grp [data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.g;
  if(a==='gopen')switchGroup(id);
  else if(a==='gclose')closeGrp();
  else if(a==='gren'){gEdit=id;refreshGrp()}
  else if(a==='grencancel'){gEdit=null;refreshGrp()}
  else if(a==='gdel'){const g=G.list.find(x=>x.id===id);if(!g)return;ask(`ลบก๊วน “${g.name}”? ผู้เล่น สกอร์ และคะแนนของก๊วนนี้จะหายทั้งหมด`,'ลบก๊วน',()=>{
    try{localStorage.removeItem(skey(id))}catch(err){}G.list=G.list.filter(x=>x.id!==id);
    if(G.cur===id){G.cur=G.list[0].id;saveG();undo=[];editId=null;const tab=S.tab;openState();S.tab=tab;commit()}else saveG();
    refreshGrp();render();toast('ลบก๊วน '+g.name+' แล้ว')})}});
$('#grp').addEventListener('click',e=>{if(e.target.id==='grp')closeGrp()});
render();
}
</script>
